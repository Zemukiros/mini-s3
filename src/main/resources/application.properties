spring.application.name=mini-s3
spring.threads.virtual.enabled=true

# Replication settings (shared by the API and the worker)
minis3.replication-factor=3
minis3.write-quorum=2
minis3.virtual-nodes=200

# Object bodies are raw bytes. Stop Spring from trying to parse a PUT body as a form.
spring.mvc.formcontent.filter.enabled=false
