server.port=${PORT:8090}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minis3}
spring.datasource.username=${DB_USER:minis3}
spring.datasource.password=${DB_PASSWORD:minis3}
# The API server owns the schema; the worker just waits for it.
spring.sql.init.mode=never

minis3.tmp-dir=${TMP_DIR:/tmp/minis3-worker}
minis3.heartbeat-timeout-seconds=6
minis3.failure-check-ms=2000
minis3.repair-ms=3000
minis3.gc-ms=5000
minis3.pending-timeout-minutes=15
