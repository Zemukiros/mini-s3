server.port=${PORT:9001}

# Storage nodes never talk to Postgres, so skip the datasource entirely.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration

minis3.node-id=${NODE_ID:node-1}
minis3.node-url=${NODE_URL:http://localhost:9001}
minis3.data-dir=${DATA_DIR:/tmp/minis3-data/node-1}
minis3.api-url=${API_URL:http://localhost:8080}
minis3.heartbeat-ms=2000
