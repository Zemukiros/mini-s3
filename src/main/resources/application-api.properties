server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minis3}
spring.datasource.username=${DB_USER:minis3}
spring.datasource.password=${DB_PASSWORD:minis3}
spring.sql.init.mode=always

minis3.api-key=${API_KEY:dev-key}
minis3.max-upload-bytes=${MAX_UPLOAD_BYTES:104857600}
minis3.tmp-dir=${TMP_DIR:/tmp/minis3-api}
